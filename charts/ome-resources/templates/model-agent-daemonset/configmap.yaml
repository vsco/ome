apiVersion: v1
kind: ConfigMap
metadata:
  name: model-agent-config-map
  namespace: {{ .Release.Namespace }}
data:
  # Instance type → GPU name mapping (AWS, OCI, Azure, GCP, CoreWeave, Nebius, …).
  # Configure via .Values.modelAgent.instanceTypeMap (map of string → string, JSON-serialized).
  instance-type-map: |-
{{- toJson .Values.modelAgent.instanceTypeMap | nindent 4 }}
