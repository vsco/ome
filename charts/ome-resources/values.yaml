# VSCO fork: Helm charts are published to oci://ghcr.io/vsco/charts (see .github/workflows/vsco-publish-helm-charts.yaml).
# shared-infra only sets var.ome_version (chart semver). Forked ome-manager uses a full image ref so other images can stay on global.hub.
global:
  hub: "ghcr.io/vsco"
  imagePullSecrets:
    - name: ghcr-creds

ome:
  version: &defaultVersion v0.1.5-vsco5
  metricsaggregator:
    enableMetricAggregation: "false"
    enablePrometheusScraping: "false"
  benchmarkJob:
    image: genai-bench
    tag: 0.1.113
    cpuRequest: "2"
    memoryRequest: "2Gi"
    cpuLimit: "2"
    memoryLimit: "2Gi"
  multinodeProber:
    image: multinode-prober
    tag: *defaultVersion
    memoryRequest: 100Mi
    cpuRequest: 100m
    memoryLimit: 100Mi
    cpuLimit: 100m
    startupFailureThreshold: 150
    startupPeriodSeconds: 30
    startupTimeoutSeconds: 60
    startupInitialDelaySeconds: 120
    unavailableThresholdSeconds: 600
  controller:
    replicaCount: 3
    deploymentMode: "RawDeployment"
    ingressGateway:
      domain: svc.cluster.local
      domainTemplate: "{{ .Name }}.{{ .Namespace }}.{{ .IngressDomain }}"
      urlScheme: http
      disableIstioVirtualHost: false
      localGateway:
        gateway: knative-serving/knative-local-gateway
        gatewayService: knative-local-gateway.istio-system.svc.cluster.local
      ingressGateway:
        gateway: knative-serving/knative-ingress-gateway
        gatewayService: istio-ingressgateway.istio-system.svc.cluster.local
        className: istio
      omeIngressGateway: ""
      additionalIngressDomains: null
      pathTemplate: ""
      disableIngressCreation: true
      enableGatewayAPI: false
    nodeSelector: {}
    tolerations: []
    topologySpreadConstraints: []
    affinity: {}
    image: ome-manager
    tag: *defaultVersion
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 2
        memory: 4Gi
  omeAgent:
    image: ome-agent
    tag: *defaultVersion
    authType: InstancePrincipal
    compartmentId: ocid1.compartment.oc1..dummy-compartment
    vaultId: ocid1.vault.oc1.ap-osaka-1.dummy.dummy-vault
    region: ap-osaka-1
    modelInit:
      memoryRequest: 150Gi
      memoryLimit: 180Gi
      cpuRequest: 15
      cpuLimit: 15
      extraEnvVars: []
      extraVolumeMounts: []
    fineTunedAdapter:
      memoryRequest: 300Gi
      memoryLimit: 320Gi
      cpuRequest: 15
      cpuLimit: 15
  kedaConfig:
    enableKeda: true
    promServerAddress: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
    customPromQuery: ""
    scalingThreshold: "10"
    scalingOperator: "GreaterThanOrEqual"
  # JSON merged into inferenceservice-config modelStorage (pvcClaimName / pvcMountRoot).
  # Per-InferenceService override: annotation ome.io/model-storage-pvc.
  modelStorage: {}
modelAgent:
  hostPath: /mnt/data/models
  # EFS (ReadWriteMany) or other RWX PVC for shared model cache; aligns with ome.modelStorage.
  persistence:
    enabled: false
    create: false
    claimName: ome-models-efs
    accessModes:
      - ReadWriteMany
    storageClassName: efs-sc-gp
    size: 200Gi
  priorityClassName: system-node-critical
  serviceAccountName: ome-model-agent
  image:
    # Docker registry hub. If set, overrides global.hub for model-agent.
    # If repository contains '/', hub is ignored.
    # Leave empty to use global.hub
    hub: ""
    repository: model-agent
    pullPolicy: Always
    tag: *defaultVersion

  # Instance type → GPU label map for model-agent (JSON in ConfigMap key instance-type-map).
  # Extend or replace per cluster; aligns with shared-infra AWS GPU pools when published from this fork.
  instanceTypeMap:
    "BM.GPU.A10.4": "A10"
    "BM.GPU.A100-v2.8": "A100-80G"
    "BM.GPU4.8": "A100-40G"
    "BM.GPU.B4.8": "A100-40G"
    "BM.GPU.H100.8": "H100"
    "BM.GPU.H100-NC.8": "H100"
    "BM.GPU.H200.8": "H200"
    "BM.GPU.H200-NC.8": "H200"
    "BM.GPU.B200.8": "B200"
    "p5.48xlarge": "H100"
    "Standard_ND96isr_H100_v5": "H100"
    "a3-highgpu-8g": "H100"
    "gd-8xh100ib-i128": "H100"
    "gd-8xh200ib-i128": "H200"
    "gd-8xl40-i128": "L40"
    "gpu-h100-sxm": "H100"
    "gpu-h200-sxm": "H200"
    "gpu-b200-sxm": "B200"
    "gpu-l40s": "L40S"
    "g4dn.xlarge": "T4"
    "g4dn.2xlarge": "T4"
    "g4dn.4xlarge": "T4"
    "g4dn.8xlarge": "T4"
    "g4dn.12xlarge": "T4"
    "g4dn.16xlarge": "T4"
    "g4dn.metal": "T4"
    "g6e.xlarge": "L40S"
    "g6e.2xlarge": "L40S"
    "g6e.4xlarge": "L40S"
    "g6e.8xlarge": "L40S"
    "g6e.12xlarge": "L40S"
    "g6e.16xlarge": "L40S"
    "g6e.24xlarge": "L40S"
    "g6e.48xlarge": "L40S"
    "g5.xlarge": "A10G"
    "g5.2xlarge": "A10G"
    "g5.4xlarge": "A10G"
    "g5.8xlarge": "A10G"
    "g5.12xlarge": "A10G"
    "g5.16xlarge": "A10G"
    "g5.24xlarge": "A10G"
    "g5.48xlarge": "A10G"
    "p4d.24xlarge": "A100-40G"
    "p4de.24xlarge": "A100-80G"

  # When enabled, the model agent will only run on nodes with GPU
  gpuNodesOnly: false

  # GPU node label selector (used when gpuNodesOnly is true)
  # Examples:
  #   For NVIDIA GPU operator: nvidia.com/gpu.present: "true"
  #   For Nebius: nebius.com/gpu: "true"
  #   For AWS: node.kubernetes.io/instance-type: g4dn.xlarge
  gpuNodeLabel:
    key: nvidia.com/gpu.present
    value: "true"

  nodeSelector: {}

  # Additional volumes to mount into the model-agent DaemonSet pods
  # Examples:
  # extraVolumes:
  #   - name: shared-tmp
  #     emptyDir: {}
  #   - name: config
  #     configMap:
  #       name: my-config
  extraVolumes: []

  # Additional volumeMounts for the model-agent container
  # Examples:
  # extraVolumeMounts:
  #   - name: shared-tmp
  #     mountPath: /tmp/shared
  #   - name: config
  #     mountPath: /etc/model-agent/config
  #     readOnly: true
  extraVolumeMounts: []

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  health:
    port: 8080

  # Additional environment variables for the model-agent container
  # Examples:
  # env:
  #   LOG_LEVEL: "debug"
  #   DOWNLOAD_RETRY: "5"
  env: {}

  resources:
    limits:
      cpu: '10'
      memory: 100Gi
    requests:
      cpu: '10'
      memory: 100Gi
