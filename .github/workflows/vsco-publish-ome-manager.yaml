## VSCO FORK ONLY — REMOVE BEFORE OPENING A PR TO sgl-project/ome
##
## This workflow builds dockerfiles/manager.Dockerfile and pushes ONLY to:
##   ghcr.io/vsco/ome-manager:<tag>
## (Not ghcr.io/moirai-internal — that is upstream Makefile / other workflows.)
##
## Delete this entire file when upstreaming your fork (or keep it only on a
## long-lived internal branch). Upstream does not need VSCO registry automation.
##
## Usage:
##   Actions → "VSCO (fork): publish ome-manager to ghcr.io/vsco" → Run workflow
##   Default tag matches local manual pushes: v0.1.5-vsco1. Override "image_tag"
##   for a new release, or clear it to use git short SHA instead.
##
## Auth: default GITHUB_TOKEN usually works for packages:write in the vsco org.
##       If pushes fail with 403, add a repo secret VSCO_GHCR_TOKEN (PAT with
##       write:packages) and uncomment the password line below.
## =============================================================================
